<style>
/* Accesibilidad — respeta la preferencia del sistema operativo/navegador de reducir animaciones */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}
/* Skip link — visible solo al recibir foco por teclado */
.skip-link{position:absolute;left:-9999px;top:0;background:#C8682E;color:#fff;padding:10px 18px;border-radius:0 0 8px 0;font-family:'Inter',Arial,sans-serif;font-size:14px;font-weight:600;text-decoration:none;z-index:1000;}
.skip-link:focus{left:0;}
/* Focus visible consistente en toda la página */
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
  outline:2px solid #C8682E; outline-offset:2px;
}
</style>
